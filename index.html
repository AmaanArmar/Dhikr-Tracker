<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dhikr Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    button {
      padding: 10px 20px;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #1c7ed6;
    }
    input[type="time"] {
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Dhikr Tracker</h2>
    <p>Keep count of your remembrance of Allah.</p>
    
    <!-- Your existing tracker elements can go here -->

    <div style="background: #111; padding: 15px; border-radius: 8px; margin-top: 20px;">
      <p style="margin-bottom: 8px; font-weight: bold; font-size: 14px;">Set Daily Dhikr Reminder</p>
      <input type="time" id="reminderTime">
      <br>
      <button onclick="scheduleReminder()">Save Reminder Time</button>
    </div>
  </div>

  <script>
    // 1. Register the Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          await navigator.serviceWorker.register('sw.js');
          console.log('Service Worker registered successfully!');
        } catch (error) {
          console.log('Service Worker registration failed:', error);
        }
      });
    }

    // 2. Function to request permission and save reminder time
    async function scheduleReminder() {
      if (!('Notification' in window)) {
        alert('This browser does not support desktop notifications.');
        return;
      }

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        alert('Please allow notifications to receive reminders.');
        return;
      }

      const timeInput = document.getElementById('reminderTime').value;
      if (!timeInput) {
        alert('Please select a time first!');
        return;
      }

      localStorage.setItem('dhikrReminderTime', timeInput);
      alert('Reminder set for ' + timeInput + '! Jazakallah Khair.');
    }
  </script>

</body>
</html>
