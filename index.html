<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dhikr Tracker Engine</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="card auth-card">
    <h2 id="authTitle">Sign In</h2>
    <div class="input-group">
      <input type="email" id="authEmail" placeholder="Email" required>
    </div>
    <div class="input-group">
      <input type="password" id="authPassword" placeholder="Password" required>
    </div>
    <button id="mainAuthBtn" class="btn btn-primary" onclick="processAuth()">Sign In</button>
    <p class="toggle-text" id="toggleAuthText" onclick="toggleAuthMode()">Need an account? Register here</p>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="mainDashboard" class="hidden">
    <header class="app-header">
      <div class="user-info">
        <span>Logged in as: <strong id="userDisplay">...</strong></span>
      </div>
      <button class="btn btn-small btn-secondary" onclick="logOut()">Sign Out</button>
    </header>

    <!-- TOP NAVIGATION -->
    <nav class="nav-bar">
      <button class="nav-btn active" onclick="switchTab('counterTab', this)">Counter</button>
      <button class="nav-btn" onclick="switchTab('historyTab', this)">History</button>
      <button class="nav-btn" onclick="switchTab('usageTab', this)">Analytics</button>
      <button class="nav-btn" onclick="switchTab('wisdomTab', this)">AI Wisdom</button>
    </nav>

    <!-- TAB 1: COUNTER -->
    <section id="counterTab" class="tab-content active">
      <div class="card counter-card">
        <div class="dhikr-select-wrapper">
          <select id="dhikrSelect">
            <option value="SubhanAllah">SubhanAllah (سُبْحَانَ اللَّهِ)</option>
            <option value="Alhamdulillah">Alhamdulillah (الْحَمْدُ لِلَّهِ)</option>
            <option value="Allahu Akbar">Allahu Akbar (اللَّهُ أَكْبَرُ)</option>
            <option value="La ilaha illallah">La ilaha illallah (لَا إِلٰهَ إِلَّا اللَّهُ)</option>
          </select>
        </div>

        <div class="counter-display">
          <button id="counterBtn" onclick="increment()">0</button>
        </div>

        <div class="counter-stats">
          <div>Lap: <span id="lapCount">0/33</span></div>
          <div>Rounds: <span id="roundsCount">0</span></div>
        </div>

        <div class="counter-actions">
          <button class="btn btn-secondary" onclick="decrement()">-1</button>
          <button class="btn btn-secondary" onclick="resetCounter()">Reset</button>
          <button class="btn btn-primary" onclick="saveSessionToCloud()">Save to Cloud</button>
        </div>
      </div>
    </section>

    <!-- TAB 2: HISTORY -->
    <section id="historyTab" class="tab-content">
      <div class="card">
        <h3>Cloud Log History</h3>
        <div id="logContainer">
          <p style="color: var(--text-muted);">No logs in Cloud.</p>
        </div>
      </div>
    </section>

    <!-- TAB 3: ANALYTICS -->
    <section id="usageTab" class="tab-content">
      <div class="card">
        <h3>Weekly Recitation Activity</h3>
        <canvas id="usageChart" width="400" height="200"></canvas>
      </div>
    </section>

    <!-- TAB 4: AI WISDOM -->
    <section id="wisdomTab" class="tab-content">
      <div class="card">
        <h3>Dhikr Companion Stream</h3>
        <div id="chatContainer" class="chat-container"></div>
        <button class="btn btn-primary" onclick="askRandomWisdom()" style="margin-top: 15px;">Get Reminder</button>
      </div>
    </section>
  </div>

  <script src="kibla.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
